spring:
  config:
    import: optional:file:.test.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:driply_test}
    username: ${DB_USERNAME:shin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
  cloud:
    stream:
      binders:
        kafka-binder:
          type: kafka
          environment:
            spring.cloud.stream.kafka.binder.brokers: ${KAFKA_HOST:localhost}:9092