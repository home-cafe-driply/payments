spring:
  application:
    name: payments
  profiles:
    active: dev
    include: secret
  cloud:
    stream:
      binders:
        kafka-binder:
          type: kafka
          environment:
            spring.cloud.stream.kafka.binder.brokers: kafka:9092
      bindings:
        consumer-in-0:
          destination: payment-callback
          group: payment-callback-group
          binder: kafka-binder
          contentType: application/json

        producer-out-0:
          destination: payment-callback
          binder: kafka-binder
          contentType: application/json
