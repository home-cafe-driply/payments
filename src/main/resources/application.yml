app:
  domain:
    name: driply-coffee.shop
    base-url: https://driply-coffee.shop
spring:
  application:
    name: payments
  profiles:
    active: dev
    include: secret
  kafka:
    bootstrap-servers: kafka:9092
  cloud:
    stream:
      binders:
        kafka-binder:
          type: kafka
          environment:
            spring.cloud.stream.kafka.binder.brokers: kafka:9092
      bindings:
        consumer-in-0:
          destination: payment-callback
          group: payment-callback-group
          binder: kafka-binder
          contentType: application/json
        producer-out-0:
          destination: payment-callback
          binder: kafka-binder
          contentType: application/json
security:
  protected:
    paths:
      - /api/v1/payment/callback
  proxy:
    hosts:
      - nginx