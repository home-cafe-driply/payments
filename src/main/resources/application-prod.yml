spring:
  config:
    import:
      optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_SERVER:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME:shin}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
